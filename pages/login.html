<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - Panadería San Carlos</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="../css/estilos.css">

</head>

<body class="pagina-login">


<div class="login-contenedor">


    <!-- ==========================
         LADO IZQUIERDO
    =========================== -->

    <div class="login-presentacion">

        <div class="login-presentacion-contenido">

            <img
                src="../img/logo-umg.png"
                alt="Universidad Mariano Gálvez"
                class="login-logo-umg">

            <span class="login-etiqueta">
                SISTEMA DE GESTIÓN
            </span>

            <h1>
                Panadería
                <span>San Carlos</span>
            </h1>

            <p>
                Administración de producción,
                inventario y pedidos de sucursales.
            </p>

        </div>

    </div>



    <!-- ==========================
         FORMULARIO
    =========================== -->

    <div class="login-formulario-contenedor">

        <div class="login-formulario">


            <div class="mb-4">

                <h2>
                    Iniciar sesión
                </h2>

                <p class="text-muted">
                    Ingresa tus credenciales para acceder al sistema.
                </p>

            </div>


            <!-- MENSAJE -->

            <div
                id="mensajeLogin"
                class="d-none">
            </div>


            <form
                id="formLogin"
                autocomplete="off">


                <!-- USUARIO -->

                <div class="mb-3">

                    <label
                        for="usuario"
                        class="form-label">

                        Usuario

                    </label>

                    <input
                        type="text"
                        id="usuario"
                        class="form-control form-control-lg"
                        placeholder="Ingrese su usuario"
                        maxlength="60"
                        required>

                </div>



                <!-- CONTRASEÑA -->

                <div class="mb-4">

                    <label
                        for="password"
                        class="form-label">

                        Contraseña

                    </label>


                    <div class="input-group">

                        <input
                            type="password"
                            id="password"
                            class="form-control form-control-lg"
                            placeholder="Ingrese su contraseña"
                            required>


                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            id="btnMostrarPassword">

                            Mostrar

                        </button>

                    </div>

                </div>



                <!-- BOTON -->

                <button
                    type="submit"
                    id="btnLogin"
                    class="btn btn-panaderia btn-lg w-100">

                    Iniciar sesión

                </button>


            </form>



            <div class="text-center mt-4">

                <a
                    href="../index.html"
                    class="login-regresar">

                    ← Regresar a la página principal

                </a>

            </div>


        </div>

    </div>

</div>

<script src="../js/config.js"></script>
<script src="../js/login.js"></script>

</body>

</html>
