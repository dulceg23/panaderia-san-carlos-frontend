<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sucursales - Panadería</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS propio -->
    <link
        rel="stylesheet"
        href="../css/estilos.css">

</head>

<body>

<div class="d-flex">

    <!-- ==========================================
         MENU LATERAL
    =========================================== -->

    <aside class="sidebar">

        <div class="p-4">

            <h4 class="mb-1">
                Panadería
            </h4>

            <small>
                Control de Producción
            </small>

        </div>


        <nav>

            <a href="panel.html"
               class="menu-link">
                Inicio
            </a>

            <a href="productos.html"
               class="menu-link">
                Productos
            </a>

            <a href="sucursales.html"
               class="menu-link activo">
                Sucursales
            </a>

            <a href="recetas.html"
               class="menu-link">
                Recetas
            </a>

            <a href="inventario.html"
               class="menu-link">
                Inventario
            </a>

            <a href="produccion.html"
               class="menu-link">
                Producción
            </a>

            <a href="pedidos.html"
               class="menu-link">
                Pedidos
            </a>

        </nav>


        <div class="universidad">

            <strong>
                Universidad Mariano Gálvez
            </strong>

            <br>

            Desarrollo Web

        </div>

    </aside>


    <!-- ==========================================
         CONTENIDO
    =========================================== -->

    <main class="contenido flex-grow-1">

        <div class="container-fluid">

            <!-- ENCABEZADO -->

            <div class="
                d-flex
                justify-content-between
                align-items-center
                flex-wrap
                gap-3
                mb-4">

                <div>

                    <h1>
                        Sucursales
                    </h1>

                    <p class="text-muted mb-0">

                        Administración de las sucursales
                        que realizan pedidos a producción.

                    </p>

                </div>


                <button
                    class="btn btn-panaderia"
                    onclick="abrirNuevaSucursal()">

                    + Nueva sucursal

                </button>

            </div>


            <!-- MENSAJES -->

            <div id="mensaje"></div>


            <!-- BUSQUEDA -->

            <div class="card mb-4">

                <div class="card-body">

                    <div class="row g-3">

                        <div class="col-md-9">

                            <label
                                for="buscarSucursal"
                                class="form-label">

                                Buscar sucursal

                            </label>

                            <input
                                type="text"
                                id="buscarSucursal"
                                class="form-control"
                                placeholder="Escriba el nombre de la sucursal">

                        </div>


                        <div class="col-md-3 d-flex align-items-end">

                            <button
                                class="btn
                                       btn-outline-secondary
                                       w-100"
                                onclick="limpiarBusqueda()">

                                Limpiar búsqueda

                            </button>

                        </div>

                    </div>

                </div>

            </div>


            <!-- TABLA -->

            <div class="card">

                <div class="card-body">

                    <div class="table-responsive">

                        <table
                            class="table
                                   table-hover
                                   align-middle">

                            <thead>

                                <tr>

                                    <th>ID</th>

                                    <th>Nombre</th>

                                    <th>Estado</th>

                                    <th class="text-center">
                                        Acciones
                                    </th>

                                </tr>

                            </thead>


                            <tbody id="tablaSucursales">

                                <tr>

                                    <td
                                        colspan="4"
                                        class="text-center">

                                        Cargando sucursales...

                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </main>

</div>


<!-- ==========================================
     MODAL SUCURSAL
=========================================== -->

<div
    class="modal fade"
    id="modalSucursal"
    tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">


            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="tituloModalSucursal">

                    Nueva sucursal

                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                <form id="formSucursal">

                    <input
                        type="hidden"
                        id="idSucursal">


                    <div class="mb-3">

                        <label
                            for="nombreSucursal"
                            class="form-label">

                            Nombre de la sucursal

                        </label>


                        <input
                            type="text"
                            id="nombreSucursal"
                            class="form-control"
                            maxlength="100"
                            placeholder="Ejemplo: ZONA 1"
                            required>

                    </div>

                </form>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancelar

                </button>


                <button
                    type="button"
                    class="btn btn-panaderia"
                    onclick="guardarSucursal()">

                    Guardar

                </button>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<!-- API -->
<script src="../js/api.js"></script>

<!-- Sucursales -->
<script src="../js/sucursales.js"></script>

</body>

</html>
